name: validate-results

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check shell syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done

      - name: Validate result CSV schema and raw files
        run: python3 analysis/summarize.py --check

      - name: Compile Python tools
        run: python3 -m py_compile analysis/summarize.py analysis/plot_results.py
